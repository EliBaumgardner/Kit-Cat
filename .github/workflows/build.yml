name: Build and test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --target CatKit_Standalone CatKit_VST3 CatKit_AU CatKitProbe CatKit_Tests

      - name: Test
        run: ctest --test-dir build --output-on-failure
